name: Build Marketplace CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --project-name marketplace_ci --platforms=android .

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Check url_launcher
        run: flutter pub deps

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
